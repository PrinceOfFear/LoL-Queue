[project]
name = "lolqueue"
version = "0.1.0"
description = "Automação de fila do League of Legends via LCU API"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.10",
    "requests>=2.32",
    "psutil>=6.0",
    "keyboard>=0.13.5",
    # A leitura do minimapa faz correlação pixel a pixel; em Python puro
    # não fecha dentro de um quadro.
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
