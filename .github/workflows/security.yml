name: Security and regression checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Update pip security baseline
        run: python -m pip install --upgrade pip
      - name: Install application and security tooling
        run: python -m pip install -e ".[dev,security,servidor]"
      - name: Compile source
        run: python -m compileall -q lolqueue servidor tools main.py
      - name: Local security audit
        run: python tools/auditar_seguranca.py --tests
      - name: Bandit Python security checks
        run: bandit -q -r lolqueue servidor tools -ll
      - name: Dependency vulnerability audit
        run: pip-audit --local --progress-spinner off --skip-editable
